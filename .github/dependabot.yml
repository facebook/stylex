# Dependabot configuration
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# `groups` bundles all updates for an ecosystem into a SINGLE pull request
# instead of one PR per dependency. This applies to both version updates and
# (when "Grouped security updates" is enabled in repo settings) security
# updates.
#
# NOTE: severity filtering (e.g. "only critical") is NOT configurable here —
# it is set via repo Settings > Code security > Dependabot auto-triage rules.
version: 2
updates:
  # JavaScript/TypeScript dependencies across the monorepo (root + workspaces).
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      flow-hermes:
        patterns:
          - 'flow-*'
          - 'hermes-*'
          - '*hermes-parser*'
          - '@babel/preset-flow'
      babel:
        patterns:
          - '@babel/*'
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
          - 'react-server-dom-webpack'
      prettier:
        patterns:
          - 'prettier'
      storybook:
        patterns:
          - 'storybook'
          - '@storybook/*'
          - 'eslint-plugin-storybook'
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
      typescript-eslint:
        patterns:
          - 'typescript-eslint'
          - '@typescript-eslint/*'
      npm-dependencies:
        update-types:
          - 'minor'
          - 'patch'
        patterns:
          - '*'
      npm-dependencies-major:
        update-types:
          - 'major'
        patterns:
          - '*'

  # GitHub Actions used in .github/workflows.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - '*'
